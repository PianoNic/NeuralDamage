<div hlmMessage [align]="isBot() ? 'start' : 'end'" class="group">
  <hlm-avatar hlmMessageAvatar class="size-8">
    @if (message().senderAvatar) {
      <img hlmAvatarImage [src]="message().senderAvatar" [alt]="message().senderName" />
    }
    <span hlmAvatarFallback class="text-xs font-semibold">{{ senderInitial() }}</span>
  </hlm-avatar>

  <div hlmMessageContent>
    <div hlmMessageHeader class="gap-2">
      <span class="text-foreground font-medium">{{ message().senderName }}</span>
      @if (isBot()) {
        <span hlmBadge variant="secondary" class="px-1.5 py-0 text-[10px] leading-4">BOT</span>
      }
      <span>{{ sentAt() }}</span>
    </div>

    @if (hasReply()) {
      <div class="border-primary/50 bg-muted/50 max-w-sm rounded-sm border-l-2 px-3 py-1.5 text-xs">
        <span class="text-foreground font-medium">{{ message().replyTo!.senderName }}</span>
        <p class="text-muted-foreground truncate">{{ message().replyTo!.content }}</p>
      </div>
    }

    <div hlmBubble [variant]="isBot() ? 'muted' : 'default'" [align]="isBot() ? 'start' : 'end'">
      <div hlmBubbleContent>
        @if (isBot()) {
          <pk-message-content class="bg-transparent p-0" [markdown]="true" [content]="message().content" />
        } @else {
          {{ message().content }}
        }
      </div>

      @if (hasReactions()) {
        <div hlmBubbleReactions [align]="isBot() ? 'start' : 'end'">
          <app-reaction-bar
            [reactions]="message().reactions"
            (toggleReaction)="toggleReaction($event)"
          />
        </div>
      }
    </div>

    <div hlmMessageFooter class="invisible gap-1 group-hover:visible">
      <button hlmBtn variant="ghost" size="sm" class="h-6 px-2 text-xs" (click)="onReply()">
        Reply
      </button>
    </div>
  </div>
</div>
