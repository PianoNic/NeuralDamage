<div #composer>
  <!-- Reply preview -->
  @if (replyingTo(); as reply) {
    <div class="mb-2 flex items-center justify-between rounded-lg border border-border bg-muted/50 px-3 py-2">
      <div class="min-w-0 flex-1 text-xs">
        <span class="text-muted-foreground">Replying to </span>
        <span class="font-semibold text-foreground">{{ reply.senderName }}</span>
        <p class="truncate text-muted-foreground">{{ reply.content }}</p>
      </div>
      <button
        hlmBtn
        variant="ghost"
        size="icon"
        class="ml-2 h-6 w-6 shrink-0"
        aria-label="Cancel reply (Esc)"
        (click)="onCancelReply()"
      >
        <ng-icon name="lucideX" class="size-3.5" />
      </button>
    </div>
  }

  <!-- Slash command / mention suggestions -->
  @if (suggestions().length > 0) {
    <div
      class="mb-2 max-h-60 overflow-y-auto rounded-lg border border-border bg-card p-1 shadow-lg"
      role="listbox"
      aria-label="Suggestions"
    >
      @for (item of suggestions(); track item.key; let i = $index) {
        <button
          hlmBtn
          variant="ghost"
          type="button"
          role="option"
          class="w-full justify-start gap-2 text-sm"
          [class.bg-accent]="i === activeIndex()"
          [attr.aria-selected]="i === activeIndex()"
          (mousedown)="$event.preventDefault()"
          (mouseenter)="activeIndex.set(i)"
          (click)="pick(item)"
        >
          @if (item.kind === 'command') {
            <ng-icon name="lucideSquareTerminal" class="text-muted-foreground size-4 shrink-0" />
            <span class="font-mono font-medium">{{ item.label }}</span>
            <span class="text-muted-foreground ml-auto hidden truncate text-xs sm:inline">
              {{ item.description }}
            </span>
          } @else {
            <hlm-avatar class="h-6 w-6">
              @if (item.member?.avatarUrl) {
                <img hlmAvatarImage [src]="item.member!.avatarUrl" [alt]="item.label" />
              }
              <span hlmAvatarFallback class="text-[10px]">{{ (item.label || 'U').charAt(0).toUpperCase() }}</span>
            </hlm-avatar>
            <span class="truncate">{{ item.label }}</span>
            @if (item.member?.memberType === 'bot') {
              <span hlmBadge variant="secondary" class="ml-auto px-1 py-0 text-[10px]">BOT</span>
            }
          }
        </button>
      }
    </div>
  }

  <!-- Input area -->
  <pk-prompt-input
    class="bg-muted/40 border-0 shadow-none"
    [value]="content()"
    (valueChange)="onValueChange($event)"
    (submitted)="onSend()"
  >
    <pk-prompt-input-textarea
      [placeholder]="replyingTo() ? 'Reply to ' + replyingTo()!.senderName + '...' : 'Ask anything, @mention a bot, or type / for commands...'"
    />
    <pk-prompt-input-actions class="mt-2 justify-end">
      <pk-prompt-input-action tooltip="Send message">
        <button
          hlmBtn
          size="icon-sm"
          type="button"
          class="rounded-full"
          aria-label="Send message"
          [disabled]="!content().trim()"
          (click)="onSend()"
        >
          <ng-icon name="lucideArrowUp" class="size-3.5" />
        </button>
      </pk-prompt-input-action>
    </pk-prompt-input-actions>
  </pk-prompt-input>
</div>
