<div class="relative flex min-h-0 flex-1">
  <section class="flex min-h-0 min-w-0 flex-1 flex-col">
    <!-- Header -->
    <header class="border-border flex shrink-0 items-center justify-between gap-3 border-b px-4 py-2">
      <div class="flex min-w-0 items-center gap-2">
        <button hlmSidebarTrigger type="button">
          <span class="sr-only">Toggle sidebar</span>
        </button>
        <div class="min-w-0">
          <h2 class="text-foreground truncate text-sm font-medium">{{ chatName() }}</h2>
          <p class="text-muted-foreground flex items-center gap-1 text-xs">
            <ng-icon name="lucideUsers" class="size-3" />
            <span>{{ userCount() }}</span>
            <span class="mx-0.5">&middot;</span>
            <ng-icon name="lucideBot" class="size-3" />
            <span>{{ botCount() }}</span>
          </p>
        </div>
      </div>

      <div class="flex shrink-0 items-center gap-3">
        @if (botMembers().length > 0) {
          <div class="hidden -space-x-2 sm:flex">
            @for (bot of botMembers().slice(0, 5); track bot.id) {
              <hlm-avatar class="ring-background size-7 ring-2">
                @if (bot.avatarUrl) {
                  <img hlmAvatarImage [src]="bot.avatarUrl" [alt]="bot.displayName ?? 'Bot'" />
                }
                <span hlmAvatarFallback class="text-[10px] font-semibold">
                  {{ (bot.displayName ?? 'B').charAt(0).toUpperCase() }}
                </span>
              </hlm-avatar>
            }
          </div>
        }

        <button hlmBtn variant="outline" size="sm" (click)="toggleBotManager()">
          <ng-icon name="lucideBot" class="mr-1.5 size-4" />
          Bots
        </button>
      </div>
    </header>

    <!-- Messages -->
    @if (loading()) {
      <div class="flex flex-1 items-center justify-center">
        <pk-loader variant="dots" size="md" />
      </div>
    } @else {
      <app-message-list
        [messages]="messages()"
        [systemMessages]="systemMessages()"
        [currentUserId]="currentUserId()"
        [hasMore]="hasMore()"
        [loadingOlder]="loadingOlder()"
        (loadOlder)="loadOlder()"
        (replyTo)="setReplyTo($event)"
        (react)="toggleReaction($event.messageId, $event.emoji)"
      />
    }

    <app-typing-indicator
      class="mx-auto w-full max-w-3xl px-4"
      [typingUsers]="typingUsers()"
      [typingBots]="typingBots()"
    />

    <!-- Composer -->
    <div class="shrink-0 px-4 py-3">
      <div class="mx-auto w-full max-w-3xl">
        <app-message-input
          [members]="members()"
          [replyingTo]="replyingTo()"
          (send)="sendMessage($event)"
          (typing)="onTyping()"
          (cancelReply)="setReplyTo(null)"
        />
      </div>
    </div>
  </section>

  <!-- Bot manager: a side panel from md up, an overlay below that -->
  @if (botManagerOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/50 md:hidden"
      aria-hidden="true"
      (click)="toggleBotManager()"
    ></div>
    <app-bot-manager
      class="fixed inset-y-0 right-0 block z-50 w-full max-w-sm shadow-xl md:static md:z-auto md:w-80 md:max-w-none md:shrink-0 md:shadow-none"
      [chatId]="currentChatId ?? ''"
      [members]="members()"
      (close)="toggleBotManager()"
    />
  }
</div>
