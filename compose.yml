services:
  db:
    image: postgres:18
    container_name: neuraldamage-db
    environment:
      POSTGRES_USER: neuraldamage
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: neuraldamage
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuraldamage"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/NeuralDamage.API/Dockerfile
    container_name: neuraldamage-api
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=neuraldamage;Username=neuraldamage;Password=changeme
    volumes:
      - attachments:/app/data/attachments
    ports:
      - "3000:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  attachments:
