name: Release

# On a published release: CI, bump application.properties on main to the release tag (as PianoNic), then
# build the image (the API, which serves the SPA) from that commit and push it to GHCR as
# ghcr.io/pianonic/neuraldamage.

on:
  release:
    types: [published]

jobs:
  ci:
    name: Gates
    uses: ./.github/workflows/ci.yml

  sync-version:
    name: Bump version to the release tag
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.sync.outputs.version }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git as the maintainer
        run: |
          git config user.name "PianoNic"
          git config user.email "79938743+PianoNic@users.noreply.github.com"

      - name: Bump application.properties
        id: sync
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -uo pipefail

          # "v2.1.0" / "V2.1.0" / "2.1.0-beta.1" -> the version without a prefix.
          TAG_VERSION="$(printf '%s' "$TAG_NAME" | sed -E 's/^[^0-9]*//')"
          if ! printf '%s' "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG_NAME' is not a version (X.Y.Z or X.Y.Z-pre)."
            exit 1
          fi
          FILE_VERSION=$(grep -oP '(?<=<version>)[^<]+' application.properties)
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag version: $TAG_VERSION"
          echo "File version:        $FILE_VERSION"

          # Every exit path hands the build the commit that is on main by then.
          publish_head() {
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          }

          if [ "$TAG_VERSION" = "$FILE_VERSION" ]; then
            echo "Already in sync, nothing to commit."
            publish_head
            exit 0
          fi

          sed -i "s|<version>$FILE_VERSION</version>|<version>$TAG_VERSION</version>|" application.properties
          git add application.properties
          if git diff --cached --quiet; then
            echo "::warning::application.properties was not rewritten; leaving main as it is."
            publish_head
            exit 0
          fi

          git commit -m "Bumped application.properties to $TAG_VERSION for release [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              publish_head
              exit 0
            fi
            echo "Push $attempt was rejected; rebasing onto origin/main and trying again."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::The version bump does not rebase onto main cleanly."
              exit 1
            fi
          done
          echo "::error::Could not push the version bump to main."
          exit 1

  docker:
    name: Build and push the image
    needs: sync-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the version-bumped commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-version.outputs.sha }}

      - name: Prepare the image name
        id: prep
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # arm64 is kept from the previous release workflow, which shipped both architectures.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest, {major} and {major}.{minor} never move backwards and never to a prerelease.
      - name: Decide whether the moving tags may point at this release
        id: moving
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -uo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            echo "$TAG_NAME is a prerelease; leaving the moving tags alone."
            echo "enable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name') || published=""
          highest=$(printf '%s\n' "$published" | sed -E 's/^[^0-9]*//' | grep -E '^[0-9]' | sort -V | tail -n1)
          version="$(printf '%s' "$TAG_NAME" | sed -E 's/^[^0-9]*//')"
          echo "This release: $version, highest published: ${highest:-<none>}"
          if [ -n "$highest" ] && [ "$version" = "$highest" ]; then
            echo "enable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$TAG_NAME is not the highest published version; leaving latest, {major} and {major}.{minor} alone."
            echo "enable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ steps.moving.outputs.enable }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }},enable=${{ steps.moving.outputs.enable }}
            type=raw,value=latest,enable=${{ steps.moving.outputs.enable }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/NeuralDamage.API/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The GitHub Actions cache only. A registry cache (:buildcache) failed on GHCR with
          # "permission_denied: read_package": the export mounts layers from packages the token can't read.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: false
          sbom: false
