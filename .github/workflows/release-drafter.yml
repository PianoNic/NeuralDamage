name: Release Drafter

# Keeps a draft GitHub Release with the next version and its notes up to date on every push to main.
# Publishing that draft is the one manual step of a release (see release.yaml).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
