name: Setup Labels

# Creates or updates the labels in .github/labels.yml, which release-drafter.yml categorises releases by.
# Runs on demand and whenever labels.yml changes on main. Labels not in the file are left alone.

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Create or update labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          yq -o=json -I=0 '.[]' .github/labels.yml | while read -r label; do
            name=$(jq -r '.name' <<< "$label")
            color=$(jq -r '.color' <<< "$label")
            description=$(jq -r '.description // ""' <<< "$label")
            gh label create "$name" --color "$color" --description "$description" --repo "$GITHUB_REPOSITORY" --force
            echo "ok   $name"
          done
