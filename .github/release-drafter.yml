# The house Release Drafter config (as in Tessaly, BuccShop, KRINT and Toamaisutaa), keyed to .github/labels.yml.
#
# Releasing: this keeps a draft release with the next version on every push to main, named from the labels
# on the merged pull requests. Publishing that draft is the one manual step; release.yaml then bumps
# application.properties to the tag and pushes the image.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '⚠️ Breaking Changes'
    labels:
      - 'breaking'
      - 'major'
  - title: '🚀 Features'
    labels:
      - 'feature'
  - title: '✨ Enhancements'
    labels:
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
  - title: '🛠️ Refactors'
    labels:
      - 'refactor'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
  - title: '🔧 CI / Build'
    labels:
      - 'CI/CD'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'

no-changes-template: 'No changes in this release.'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'feature'
  patch:
    labels:
      - 'bug'
      - 'refactor'
      - 'enhancement'
      - 'documentation'
      - 'CI/CD'
  default: patch

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
